name: Release

# Tag a version to publish it: `git tag storybook-addon-lineage@0.1.0 && git push --tags`. The tag
# must match the package's version.
on:
  push:
    tags: ['storybook-addon-lineage@*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@rock-solid'
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches the version
        working-directory: packages/storybook-addon-lineage
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "${GITHUB_REF_NAME}" = "storybook-addon-lineage@${version}" || {
            echo "Tag ${GITHUB_REF_NAME} doesn't match version ${version}"
            exit 1
          }
      - run: pnpm build
      - name: Publish
        run: pnpm --filter @rock-solid/storybook-addon-lineage publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
