name: Release

# Publishes a package when its version is tagged as `<package folder>@<version>`, e.g.
# `payload-lineage@0.1.0`. Tag with `pnpm release tag --package <folder>` (see the README).
# scripts/release-target.mjs checks the tag and reads where the package publishes: its
# `publishConfig.registry`, GitHub Packages or npmjs.com, so moving a package between them only
# changes its package.json.
on:
  push:
    tags: ['*@[0-9]*']

# `bash` rather than the default `bash -e`: it adds `-o pipefail`, so a failing command in a pipe
# (`gh api … | sed`) fails the step instead of being masked
defaults:
  run:
    shell: bash

permissions:
  # contents: write for the GitHub Release
  contents: write
  # GitHub Packages
  packages: write
  # npmjs.com trusted publishing (OIDC), which also adds provenance
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # All tags, to find the package's previous release for the notes
          fetch-depth: 0
      - name: Read the tag
        id: target
        run: node scripts/release-target.mjs "$GITHUB_REF_NAME"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: ${{ steps.target.outputs.registry }}
          scope: '@rock-solid'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Publish ${{ steps.target.outputs.name }}@${{ steps.target.outputs.version }}
        # GitHub Packages takes the workflow's token. npmjs.com takes NPM_TOKEN while that secret
        # exists (the first publish, before a trusted publisher can be set up for the package),
        # then trusted publishing, with no token at all. A scoped package is private on npmjs.com
        # unless published with --access public; on GitHub Packages it follows the repo
        run: |
          pnpm --filter "./packages/${FOLDER}" publish --no-git-checks --tag "$DIST_TAG" \
            ${NPMJS:+--access public}
        env:
          FOLDER: ${{ steps.target.outputs.folder }}
          DIST_TAG: ${{ steps.target.outputs.distTag }}
          NPMJS: ${{ steps.target.outputs.github != 'true' && 'true' || '' }}
          NODE_AUTH_TOKEN: ${{ steps.target.outputs.github == 'true' && secrets.GITHUB_TOKEN || secrets.NPM_TOKEN }}
      - name: GitHub Release
        # Notes from the PRs merged since the package's previous release: the nearest earlier tag in
        # this tag's history, not the second-highest, which a later release (or hotfix) would break.
        # `|| true`: a first release has none. Each PR's full URL in GitHub's generated notes becomes
        # a `[#12](url)` link: a bare `#12` isn't linked in a release body. A prerelease is marked
        # as one, so it isn't shown as the latest release.
        run: |
          package="${GITHUB_REF_NAME%@*}"
          previous="$(git describe --tags --abbrev=0 --match "${package}@*" "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" \
            ${previous:+-f previous_tag_name="$previous"} --jq .body \
            | sed -E "s|(https://github.com/${GITHUB_REPOSITORY}/pull/([0-9]+))|[#\2](\1)|g" > release-notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md \
            ${PRERELEASE:+--prerelease}
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.target.outputs.distTag == 'next' && 'true' || '' }}
