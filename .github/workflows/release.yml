name: Release

# Publishes a package when its version is tagged, e.g. `storybook-addon-lineage@0.2.0`. Tag with
# `pnpm release tag` (see the README); the tag must match the package's version.
on:
  push:
    tags: ['storybook-addon-lineage@*']

permissions:
  # contents: write for the GitHub Release
  contents: write
  packages: write

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # All tags, to find the package's previous release for the notes
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@rock-solid'
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches the version
        working-directory: packages/storybook-addon-lineage
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "${GITHUB_REF_NAME}" = "storybook-addon-lineage@${version}" || {
            echo "Tag ${GITHUB_REF_NAME} doesn't match version ${version}"
            exit 1
          }
      - run: pnpm build
      - name: Publish
        run: pnpm --filter @rock-solid/storybook-addon-lineage publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: GitHub Release
        # Notes from the PRs merged since the package's previous release: the nearest earlier tag in
        # this tag's history, not the second-highest, which a later release (or hotfix) would break.
        # `|| true`: a first release has none. PR links are shortened to `#12`, which GitHub links
        # by itself, instead of the full URLs in GitHub's generated notes.
        run: |
          package="${GITHUB_REF_NAME%@*}"
          previous="$(git describe --tags --abbrev=0 --match "${package}@*" "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" \
            ${previous:+-f previous_tag_name="$previous"} --jq .body \
            | sed -E "s|https://github.com/${GITHUB_REPOSITORY}/pull/([0-9]+)|#\1|g" > release-notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
