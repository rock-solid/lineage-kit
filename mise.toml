# Tool versions. Keep pnpm in lockstep with `packageManager` in package.json.
[tools]
node = "24.21.0"
pnpm = "12.8.1"

# Tasks are thin aliases over the pnpm scripts in package.json, so non-mise users get the same
# commands via `pnpm <script>`. Avoid task names that are mise built-ins (install, test-tool, fmt,
# ...): `mise <name>` runs the built-in. Pass arguments after `--`: `mise changeset -- --empty`.
[tasks.setup]
description = "One-time setup for a fresh clone: dependencies, git hooks and the test browser"
run = "pnpm run setup"

[tasks.dev]
description = "Build the packages in watch mode and start the example Storybook at http://localhost:6006"
run = "pnpm dev"

[tasks.dev-payload]
description = "Build the packages in watch mode and start the example Payload admin at http://localhost:3000/admin"
run = "pnpm dev:payload"

[tasks.build]
description = "Build the packages to dist/"
run = "pnpm build"

[tasks.test]
description = "Run every package's unit tests, the Payload example's config test and the example Storybook's stories as browser tests"
run = "pnpm test"

[tasks.lint]
description = "Lint with ESLint"
run = "pnpm lint"

[tasks.typecheck]
description = "Type-check every package"
run = "pnpm typecheck"

[tasks.format]
description = "Format with Prettier"
run = "pnpm format"

[tasks.check]
description = "Everything CI checks: format, build, lint, types, tests and the example Storybook build"
run = "pnpm check"

[tasks.changeset]
description = "Add a changeset: which packages a change releases, how big a bump, and its changelog line"
run = "pnpm changeset"
